<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a14" />
    <title>غرفة الأبواب العشرة</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      Microsoft Clarity — heatmaps + session recordings.
      Replace the empty string below with your Clarity project ID
      (https://clarity.microsoft.com → New project → Tracking code → just
      the 9–10 character ID). It will then load silently for every visitor.
    -->
    <script>window.__CLARITY_ID__ = "";</script>
    <script>
      (function () {
        var id = (window.__CLARITY_ID__ || "").trim();
        if (!id) return;
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", id);
      })();
    </script>
  </head>
  <body>
    <!-- Registration overlay -->
    <div id="register-overlay" class="overlay">
      <div class="panel">
        <h1>غرفة الأبواب العشرة</h1>
        <p class="lead">
          اكتب اسمك ورقم الغرفة، ثم استكشف ما بداخلها.
        </p>
        <form id="register-form">
          <label>
            <span>الاسم</span>
            <input id="player-name" type="text" required minlength="2" maxlength="32" autocomplete="off" />
          </label>
          <label>
            <span>رقم الغرفة</span>
            <input id="room-number" type="number" min="1" max="9999" required value="1" />
          </label>
          <button type="submit" id="enter-btn">ادخل الغرفة</button>
          <p class="hint" id="register-status"></p>
        </form>
      </div>
    </div>

    <!-- Admin dashboard overlay -->
    <div id="admin-overlay" class="overlay hidden">
      <div class="panel admin-panel">
        <h1>لوحة الإدارة — غرفة <span id="admin-room"></span></h1>
        <p class="lead">قائمة اللاعبين والنتائج لهذه الغرفة (تتحدّث مباشرة).</p>
        <div id="admin-stats"></div>
        <div id="admin-list"></div>
        <button id="admin-back">العودة</button>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-top">
        <div id="player-info">
          <span id="hud-name"></span>
          <span class="dot">•</span>
          <span>غرفة <b id="hud-room"></b></span>
        </div>
        <div id="timer-wrap" class="hidden">
          <span class="timer-label">الوقت قبل الغرق</span>
          <span id="timer">05:00</span>
        </div>
      </div>
      <div id="live-equation" class="hidden">
        <span class="le-label">معادلتك الآن</span>
        <span id="le-tokens"></span>
      </div>
      <div id="prompt" class="prompt hidden"></div>
      <div id="big-notice" class="big-notice hidden"></div>
      <div id="crosshair">+</div>

      <!-- Touch controls (shown on touch devices only) -->
      <div id="touch-ui" class="hidden">
        <div id="joystick-zone"><div id="joystick-thumb"></div></div>
        <button id="touch-interact" class="touch-btn">E</button>
        <button id="touch-jump" class="touch-btn">↑</button>
        <button id="touch-dive" class="touch-btn hidden">↓</button>
      </div>
    </div>

    <!-- Result overlay -->
    <div id="result-overlay" class="overlay hidden">
      <div class="panel result-panel">
        <h1 id="result-title">—</h1>
        <p id="result-text"></p>
        <button id="result-restart">العب مرة أخرى</button>
      </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
